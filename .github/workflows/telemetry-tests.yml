name: TelemetryKit unit tests

on:
  push:
    branches: ["feat/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync telemetry sources into the test package
        run: cp ApplicationLibrary/InVPN/Telemetry/*.swift TelemetryKit/Sources/TelemetryKit/

      - name: swift test
        run: cd TelemetryKit && swift test -v
